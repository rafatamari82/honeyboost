  if(T.accent) r.setProperty('--gold', T.accent);
  if(T.accent2) r.setProperty('--gold-2', T.accent2);
  if(T.deep) r.setProperty('--amber', T.deep);
  if(T.pricingBg) r.setProperty('--brown', T.pricingBg);
  if(T.bg) r.setProperty('--cream', T.bg);

  document.title = C.pageTitle || C.product;
  /* favicon: config.favicon (image file) or auto-generated from the logo */
  (function(){
    var link = document.createElement('link'); link.rel = 'icon';
    if (C.favicon) { link.href = (C.imagePath||'') + C.favicon; }
    else {
      var letter = ((C.logoSplit && C.logoSplit[0]) || C.product || '?').charAt(0).toUpperCase();
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="'+(T.dark||'#111')+'"/><text x="32" y="45" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="40" fill="'+(T.accent||'#f5b419')+'">'+letter+'</text></svg>';
      link.type = 'image/svg+xml'; link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
    }
    document.head.appendChild(link);
  })();

  var md = document.querySelector('meta[name="description"]'); if(md) md.setAttribute('content', C.metaDescription || '');

  var esc = function(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var allowBr = function(s){ return esc(s).replace(/&lt;br&gt;/g,'<br>'); };
  var parts = function(arr, cls){ return (arr||[]).map(function(p,i){ return i%2 ? '<span'+(cls?' class="'+cls+'"':'')+'>'+esc(p)+'</span>' : esc(p); }).join(''); };
  var img = function(key){ var f = (C.images||{})[key]; return f ? (C.imagePath||'') + f : ''; };

    lock:'<rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>',
    leaf:'<path d="M11 20A7 7 0 0 1 4 13C4 7 9 3 20 3c0 11-4 17-9 17z"/><path d="M4 21c4-6 8-9 12-11"/>',
    star:'<path d="M12 2l2.4 6.9H22l-6 4.6 2.3 7L12 16.3 5.7 20.5 8 13.5 2 8.9h7.6z"/>',

          '<ul><li><a href="#what">What is it</a></li><li><a href="#ingredients">Ingredients</a></li><li><a href="#pricing">Pricing</a></li><li><a href="#guarantee">Guarantee</a></li><li><a href="#faq">FAQ</a></li></ul>'+
          '<a class="btn btn-sm"'+A+'>Order now</a></div></header><main>';

  html += '<section class="hero"><div class="wrap hero-grid"><div>'+
          '<span class="kicker">'+esc(h.kicker)+'</span><h1>'+parts(h.titleParts)+'</h1><p class="lead">'+esc(h.text)+'</p>'+

  html += '<div class="trust"><div class="wrap">'+(C.trust||[]).map(function(t){return '<div class="t"><div class="ic">'+icon(t.icon)+'</div><div><b>'+esc(t.title)+'</b><small>'+esc(t.text)+'</small></div></div>';}).join('')+'</div></div>';

  html += '<section class="how"><div class="wrap center"><span class="kicker">How it works</span><h2>'+parts(C.how.titleParts,'hl')+'</h2></div><div class="wrap how-grid">'+

  var ing = C.ingredients;

          '<div class="pc-card cons"><h3>'+cross+'Cons</h3><ul>'+(C.cons||[]).map(function(p){return '<li>'+cross+esc(p)+'</li>';}).join('')+'</ul></div></div></section>';

  var pr = C.pricing;
  html += '<section id="pricing" class="pricing"><div class="wrap center"><span class="kicker">Official pricing</span><h2>Choose your <span class="hl">package</span></h2><p class="lead">'+esc(pr.intro)+'</p></div><div class="wrap price-grid">'+

            return '<div class="pcard'+(p.best?' best':'')+'"><div class="top">'+esc(p.label)+'</div><div class="body">'+

              '<img src="'+esc(img(p.image))+'" alt="'+esc(p.qty+' of '+C.product)+'">'+
              '<div class="pp"><sup>$</sup>'+esc(p.price)+'<small>per<br>'+esc(pr.unit||'unit')+'</small></div>'+
              '<ul class="perks">'+(p.perks||[]).map(function(k){return '<li>'+check+esc(k)+'</li>';}).join('')+'</ul><div class="spacer"></div>'+
              '<a class="btn btn-block"'+A+'>Buy now</a><div class="cards-pay"><span>VISA</span><span>MASTERCARD</span><span>AMEX</span><span>DISCOVER</span></div>'+
              '<div class="total">Total: '+(p.oldTotal?'<s>'+esc(p.oldTotal)+'</s>':'')+'<b>'+esc(p.total)+'</b></div>'+
              '<div class="ship'+(p.freeShipping?' free':'')+'">'+esc(p.shipping)+'</div></div></div>';
          }).join('')+'</div><p class="price-note">'+esc(pr.note)+'</p></section>';

  var g = C.guarantee;
  html += '<section id="guarantee" class="guarantee"><div class="wrap"><div class="box"><div class="gseal"><div><b>'+esc(g.days)+'</b>DAY<br>MONEY-BACK</div></div><div>'+
          '<span class="kicker">Zero-risk trial</span><h2>'+parts(g.titleParts,'hl')+'</h2><p>'+esc(g.text)+'</p></div></div></div></section>';

  html += '<section id="faq" style="padding-top:20px"><div class="wrap center"><span class="kicker">FAQ</span><h2>Common <span class="hl">questions</span></h2></div><div class="wrap faq">'+
          (C.faq||[]).map(function(f){return '<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>';}).join('')+'</div></section>';

  var v = C.verdict;
  html += '<section class="verdict"><div class="wrap"><div><span class="kicker">Final verdict</span><h2>'+parts(v.titleParts,'hl')+'</h2>'+
          (v.paragraphs||[]).map(function(p){return '<p>'+esc(p)+'</p>';}).join('')+
          '<div style="margin-top:26px"><a class="btn"'+A+'>'+esc(v.button)+' '+arrow+'</a></div></div><img src="'+esc(img('medium'))+'" alt="'+esc(C.product)+'"></div></section></main>';

  html += '<footer><div class="wrap">'+
          '<p><strong>Affiliate disclosure:</strong> This is an independent affiliate website and is not owned or operated by the makers of '+esc(C.product)+'. Links on this page are affiliate links: if you buy through them we may receive a commission, at no extra cost to you.</p>'+
          '<p><strong>Health disclaimer:</strong> '+esc(C.disclaimer)+'</p>'+
          '<p>Prices, offers and guarantee terms are set by the official retailer and may change. All trademarks belong to their respective owners.</p>'+
          '<p>&copy; '+new Date().getFullYear()+' '+esc(C.siteName)+'</p></div></footer>';

  html += '<div class="sticky"><a class="btn btn-block"'+A+'>'+esc(C.stickyButton)+'</a></div>';

  document.getElementById('app').innerHTML = html;
})();
</script>
